<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chemistry Ions Game</title>
<style>
  :root{--bg:#0f172a;--panel:#111827;--muted:#94a3b8;--text:#e5e7eb;--accent:#22d3ee;--accent-2:#34d399}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 800px at 10% -10%, #1f2937 0%, var(--bg) 40%),radial-gradient(900px 600px at 110% 10%, #0b1220 0%, var(--bg) 50%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .app{width:min(100%,1100px);background:linear-gradient(180deg, rgba(255,255,255,.02),rgba(255,255,255,.00));border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:18px 18px 8px 18px;box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter: blur(6px)}
  header{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .title{display:flex;align-items:center;gap:10px}.title h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  select,button,input,textarea{background:#0b1220;color:var(--text);border:1px solid rgba(255,255,255,.08);padding:8px 10px;border-radius:10px;font:inherit}
  button{cursor:pointer;transition:transform .02s ease} button:active{transform:translateY(1px)}
  .btn-accent{border-color:transparent;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#0b1220;font-weight:700}
  .btn-ghost{background:transparent}
  .layout{display:grid;grid-template-columns:1fr 380px;gap:14px;margin-top:14px}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.02), rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:18px;min-height:240px}
  .big{display:flex;align-items:center;justify-content:center;text-align:center;font-size: clamp(26px, 6vw, 48px);font-weight:800;letter-spacing:.5px;min-height:180px}
  .hint{color:var(--muted);font-size:14px;text-align:center;margin-top:6px}
  .row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .row input[type=text]{min-width:260px}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .tag{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.1);color:var(--muted)}
  .good{color:#a7f3d0}.bad{color:#fecaca}
  .score{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:10px;font-size:14px;color:var(--muted)}
  .sidebar h3{margin:.2rem 0 0.4rem 0;font-size:16px}
  .list{max-height:400px;overflow:auto;border:1px solid rgba(255,255,255,.06);border-radius:10px}
  .list table{width:100%;border-collapse:collapse}
  .list th,.list td{padding:8px 10px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.06)}
  .list tr:hover td{background:rgba(255,255,255,.03)}
  .list .actions button{font-size:12px;padding:2px 8px}
  .muted{color:var(--muted)} .small{font-size:12px} .flex{display:flex;gap:8px;flex-wrap:wrap}
  .hr{height:1px;background:rgba(255,255,255,.08);margin:10px 0}
  .footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:12px}
  .kbd{border:1px solid rgba(255,255,255,.2);padding:0 6px;border-radius:6px;font-weight:700}
  .hidden{display:none !important}
  @media (max-width: 900px){.layout{grid-template-columns: 1fr}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 4h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4Zm3 0v12m10-12v12M4 8h16" stroke="url(#g)" stroke-width="1.5"/><defs><linearGradient id="g" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs></svg>
      <div>
        <h1>Chemistry Ions Game</h1>
        <div class="sub">Practice ions with flashcards & quizzes. Add your own and they’ll be saved in your browser.</div>
      </div>
    </div>
    <div class="controls">
      <select id="mode">
        <option value="name2formula">Name → Formula</option>
        <option value="formula2name">Formula → Name</option>
        <option value="multiple">Multiple Choice</option>
        <option value="flash">Flashcards</option>
      </select>
      <button id="next" class="btn-accent">Start ▶</button>
      <button id="reveal" class="btn-ghost">Reveal <span class="small muted">(Space)</span></button>
    </div>
  </header>

  <div class="layout">
    <main class="card">
      <div id="prompt" class="big">Press <span class="kbd">Start</span> to begin</div>
      <div class="hint" id="hint"></div>
      <div id="answerArea" class="row hidden">
        <input id="answer" type="text" placeholder="Type your answer…" autocomplete="off" />
        <button id="submitBtn" class="btn-accent">Check</button>
        <button id="skip" class="btn-ghost">Skip</button>
      </div>
      <div id="choices" class="row hidden"></div>
      <div class="tags" id="tags"></div>
      <div class="score" id="score">—</div>
    </main>

    <aside id="sidebar" class="sidebar card hidden"></aside>
  </div>

  <div class="footer">
    <div>Made for Abbie.</div>
  </div>
</div>
</body>
</html>
